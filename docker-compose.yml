version: '3.8'

services:
  # 1. Multi-Tenant PostgreSQL 16 Database Container
  postgres:
    image: postgres:16-alpine
    container_name: tertiuseye-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: tertiuseye
    ports:
      - "5432:5432"
    volumes:
      - ./migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tertiuseye"]
      interval: 3s
      timeout: 3s
      retries: 5

  # 2. Telemetry Ingestion Microservice Container
  ingestion-service:
    build:
      context: .
      target: ingestion-service
    container_name: tertiuseye-ingestion
    command: ["-port", "8080", "-db", "postgres://postgres:postgrespassword@postgres:5432/tertiuseye?sslmode=disable", "-workers", "50"]
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # 3. Enterprise Presentation Management Web Console Container
  webconsole-service:
    build:
      context: .
      target: agent
    container_name: tertiuseye-webconsole
    command: ["-config", "config.json", "-ui", "-port", "8090"]
    ports:
      - "8090:8090"
    depends_on:
      - ingestion-service

  # 4. Containerized Endpoint Discovery Agent
  agent:
    build:
      context: .
      target: agent
    container_name: tertiuseye-agent
    command: ["-config", "config.json", "-endpoint", "http://ingestion-service:8080/api/v1/telemetry"]
    depends_on:
      - ingestion-service
